
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Chat</title>
</head>
<body>
    <h1>OG Chat</h1>
    <p>Connect. Chat. Call.</p>
    <p id="status">Connecting to OG Chat...</p>

    <script>
        fetch("/health")
            .then(response => response.json())
            .then(data => {
                document.getElementById("status").textContent =
                    data.status === "online"
                    ? "OG Chat server is online!"
                    : "Server unavailable";
            })
            .catch(() => {
                document.getElementById("status").textContent =
                    "Could not connect to server.";
            });
    </script>
</body>
</html>
